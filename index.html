<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Will You Be My Girlfriend?</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="stars"></canvas>
  <div id="floatingHearts" class="floating-hearts" aria-hidden="true"></div>

  <main>
    <!-- SCREEN 1 : THE QUESTION -->
    <section id="page-proposal" class="screen active">
      <div class="proposal-card">
        <p class="eyebrow">a question, for you</p>
        <h1 class="proposal-title">Will you be<br>my girlfriend?</h1>
        <p class="proposal-sub">(there are two options below. only one of them stays still.)</p>

        <div class="button-row" id="buttonRow">
          <button id="yesBtn" class="btn btn-yes" type="button">Yes</button>
          <button id="noBtn" class="btn btn-no" type="button">No</button>
        </div>

        <p class="tease-line" id="teaseLine">&nbsp;</p>
      </div>
    </section>

    <!-- SCREEN 2 : THE ENVELOPE TRANSITION -->
    <div id="envelope" class="envelope" aria-hidden="true">
      <div class="envelope-body">
        <div class="envelope-flap"></div>
        <div class="envelope-letter">
          <p>she said yes</p>
        </div>
      </div>
    </div>

    <!-- SCREEN 3 : THE MEMORY WALL -->
    <section id="page-memories" class="screen">
      <div class="lights" id="lights" aria-hidden="true"></div>

      <header class="memories-header">
        <p class="eyebrow">from the day you said yes</p>
        <h2 class="memories-title">Every moment, with you</h2>
        <p class="memories-sub">a little wall of us. add more of your own below.</p>
      </header>

      <div class="gallery" id="galleryGrid"></div>

      <footer class="memories-footer">
        <p class="signature">— happy birthday, my love. here's to many, many more.</p>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
